[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vistaflow-temporary"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "opencv-contrib-python>=4.10,<5", "scipy>=1.13,<2", "PySide6>=6.7,<7"]
[project.optional-dependencies]
gestures = ["mediapipe>=0.10,<0.11"]
dev = ["pytest>=8,<10", "ruff>=0.16,<1"]
[tool.setuptools]
py-modules = ["main"]
[tool.setuptools.packages.find]
include = ["core*", "vision*", "gesture*", "ui*", "experiments*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
